# cava settings for the rice music window. Raw numbers on stdout, read by services/Viz.qml.
[general]
bars = 40
framerate = 30
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 55
